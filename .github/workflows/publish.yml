name: Application Publish
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v2.0.12)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  YTMD_UPDATE_FEED_OWNER: ${{ github.repository_owner }}
  YTMD_UPDATE_FEED_REPOSITORY: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-24.04, arch: x64 }
          - { platform: linux, os: ubuntu-24.04-arm, arch: arm64 }
          - { platform: windows, os: windows-2022, arch: x64 }
          - { platform: macos, os: macos-15-intel, arch: x64 }
          - { platform: macos, os: macos-15, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn
        run: corepack enable

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm flatpak

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build installers
        run: yarn make --arch ${{ matrix.arch }}

      - name: Create portable Linux archive
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          product_name=$(node -p "require('./package.json').productName")
          version=$(node -p "require('./package.json').version")
          app_dir="out/${product_name}-linux-${ARCH}"
          archive_name="scstym-${version}-linux-${ARCH}"
          test -x "$app_dir/youtube-music-desktop-app"
          mkdir -p out/make/tar
          staging_dir=$(mktemp -d)
          trap 'rm -rf "$staging_dir"' EXIT
          cp -a "$app_dir" "$staging_dir/$archive_name"
          tar -czf "out/make/tar/$archive_name.tar.gz" -C "$staging_dir" "$archive_name"

      - name: Install Flatpak runtime and Electron base
        if: runner.os == 'Linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --no-related -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Build Flatpak bundle
        if: runner.os == 'Linux'
        run: yarn make:flatpak ${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets

      - name: Publish installers for the pushed tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          # Refuse ambiguous asset names rather than overwriting another platform.
          duplicates=$(find release-assets -type f -printf '%f\n' | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate release asset names: $duplicates" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
